<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="quiz-container">
      <div class="user-details-wrapper">
      <div class="user-details">
        <h1>👋 Hi <span class="username"></span></h1>
        <p>Great to have you here!</p>
      </div>
      <div class="user-img-wrapper">
        <img class="user-img" src="assets/avatar.jpg" alt="user-image">
      </div>
      </div>

      <h2 class="title">Quiz App</h2>

      <div class="question-listing"></span></div>

      <h1 id="question">If Daniel's age is 27 years old in 2011, what is his age in 2005?</h2>
      <div id="answers">
        <button class="btn">Answer 1</button>
        <button class="btn">Answer 2</button>
        <button class="btn">Answer 3</button>
        <button class="btn">Answer 4</button>
      </div>
      <button id="next-btn">Next</button>
      <div id="score" class="hidden"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
